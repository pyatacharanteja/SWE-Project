<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="400" fill="white" fill-opacity="0.01"/>
  <rect x="50" y="50" width="400" height="300" rx="15" fill="#F3F4F6"/>
  
  <!-- Step 1: Create Poll -->
  <circle cx="100" cy="100" r="30" fill="#4F46E5"/>
  <text x="100" y="100" font-family="Arial" font-size="18" fill="white" text-anchor="middle" dominant-baseline="middle">1</text>
  <rect x="150" y="85" width="80" height="30" rx="5" fill="white"/>
  
  <!-- Step 2: Tokens -->
  <circle cx="100" cy="180" r="30" fill="#818CF8"/>
  <text x="100" y="180" font-family="Arial" font-size="18" fill="white" text-anchor="middle" dominant-baseline="middle">2</text>
  <rect x="150" y="165" width="120" height="30" rx="5" fill="white"/>
  <rect x="280" y="165" width="30" height="30" rx="5" fill="white"/>
  <rect x="320" y="165" width="30" height="30" rx="5" fill="white"/>
  
  <!-- Step 3: Vote -->
  <circle cx="100" cy="260" r="30" fill="#4F46E5"/>
  <text x="100" y="260" font-family="Arial" font-size="18" fill="white" text-anchor="middle" dominant-baseline="middle">3</text>
  <rect x="150" y="245" width="100" height="30" rx="5" fill="white"/>
  <path d="M270 260L290 280L320 250" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Step 4: Blockchain -->
  <circle cx="100" cy="340" r="30" fill="#818CF8"/>
  <text x="100" y="340" font-family="Arial" font-size="18" fill="white" text-anchor="middle" dominant-baseline="middle">4</text>
  
  <!-- Blockchain representation -->
  <rect x="150" y="325" width="40" height="30" rx="5" fill="white"/>
  <rect x="200" y="325" width="40" height="30" rx="5" fill="white"/>
  <rect x="250" y="325" width="40" height="30" rx="5" fill="white"/>
  <rect x="300" y="325" width="40" height="30" rx="5" fill="white"/>
  <rect x="350" y="325" width="40" height="30" rx="5" fill="white"/>
  
  <!-- Connecting Lines -->
  <path d="M100 130L100 150" stroke="#818CF8" stroke-width="2"/>
  <path d="M100 210L100 230" stroke="#818CF8" stroke-width="2"/>
  <path d="M100 290L100 310" stroke="#818CF8" stroke-width="2"/>
  
  <!-- Flow Lines -->
  <path d="M400 100L430 100L430 340L400 340" stroke="#C7D2FE" stroke-width="2" stroke-dasharray="4 4"/>
</svg> 